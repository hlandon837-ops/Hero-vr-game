<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Super Overlord VR Arena</title>
    <!-- Core VR Web Framework -->
    <script src="https://aframe.io"></script>
    <script>
      // CUSTOM MONKEY MOVEMENT SYSTEM FOR MOBILE/VR
      AFRAME.registerComponent('monkey-movement', {
        init: function () {
          this.leftHand = document.querySelector('#leftHand');
          this.rightHand = document.querySelector('#rightHand');
          this.rig = document.querySelector('#player-rig');
          
          this.isSwinging = false;
          this.lastHandPos = new THREE.Vector3();
          
          // Event Listeners for VR Controller Grip Button
          this.el.addEventListener('gripdown', (e) => {
            this.isSwinging = true;
            this.lastHandPos.copy(e.detail.target.object3D.position);
          });
          
          this.el.addEventListener('gripup', () => {
            this.isSwinging = false;
          });
        },
        
        tick: function (time, timeDelta) {
          if (!this.isSwinging) return;
          
          let currentHandPos = this.el.object3D.position;
          let deltaMovement = new THREE.Vector3().subVectors(this.lastHandPos, currentHandPos);
          
          let speedMultiplier = 4.5; 
          this.rig.object3D.position.addScaledVector(deltaMovement, speedMultiplier);
          
          if (this.rig.object3D.position.y > 0) {
            this.rig.object3D.position.y -= 0.08; 
          } else {
            this.rig.object3D.position.y = 0; 
          }
          
          this.lastHandPos.copy(currentHandPos);
        }
      });
    </script>
  </head>
  <body>
    <!-- The VR Scene Container -->
    <a-scene background="color: #111">

      <!-- LIGHTING & SKY -->
      <a-sky color="#0c051a"></a-sky>
      <a-ambient-light color="#444"></a-ambient-light>
      <a-directional-light color="#7a22ff" position="-1 4 2"></a-directional-light>

      <!-- DESTRUCTIBLE CITY BLOCKS -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#222"></a-plane>
      
      <!-- Neon structures to leap across -->
      <a-box position="-5 5 -15" width="4" height="10" depth="4" color="#00ffcc"></a-box>
      <a-box position="5 8 -20" width="6" height="16" depth="6" color="#ff0055"></a-box>
      <a-box position="0 3 -10" width="3" height="6" depth="3" color="#333"></a-box>

      <!-- HERO 1: "Lord Doomsday" (Inspired by Doctor Doom) -->
      
        <a-cone color="#135213" radius-bottom="1" height="2" position="0 1 0"></a-cone>
        <a-sphere color="#7d838a" radius="0.5" position="0 2 0"></a-sphere> 
        <a-box color="#ffe600" width="0.2" height="0.2" depth="0.2" position="0 1.2 0.5"></a-box> 
      

      <!-- HERO 2: "The Shadow Monarch" (Inspired by Sung Jinwoo) -->
      
        <a-cylinder color="#080314" radius="0.4" height="2.2" position="0 1.1 0"></a-cylinder> 
        <a-sphere color="#ffffff" radius="0.4" position="0 2.3 0"></a-sphere>
        <a-box color="#00bfff" width="0.1" height="1" depth="0.1" position="-0.6 1 0" rotation="0 0 15"></a-box>
        <a-box color="#00bfff" width="0.1" height="1" depth="0.1" position="0.6 1 0" rotation="0 0 -15"></a-box>
      

      <!-- PLAYER CONTROLLER RIG -->
      
        <a-camera position="0 1.6 0"></a-camera>
        
        
      

    </a-scene>
  </body>
</html>
