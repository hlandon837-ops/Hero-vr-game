<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Super Overlord VR Arena</title>
    <!-- Combined High-Speed Secure Loader -->
    <script src="https://jsdelivr.net"></script>
    <script>
      // OFFICIAL MONKEY PHYSICS LOCOMOTION
      AFRAME.registerComponent('monkey-movement', {
        init: function () {
          this.leftHand = document.querySelector('#leftHand');
          this.rightHand = document.querySelector('#rightHand');
          this.rig = document.querySelector('#player-rig');
          
          this.isSwinging = false;
          this.lastHandPos = new THREE.Vector3();
          
          // Trigger physics calculation when the side grip is pulled
          this.el.addEventListener('gripdown', (e) => {
            this.isSwinging = true;
            this.lastHandPos.copy(e.detail.target.object3D.position);
          });
          
          this.el.addEventListener('gripup', () => {
            this.isSwinging = false;
          });
        },
        
        tick: function (time, timeDelta) {
          if (!this.isSwinging) return;
          
          let currentHandPos = this.el.object3D.position;
          let deltaMovement = new THREE.Vector3().subVectors(this.lastHandPos, currentHandPos);
          
          // Physics momentum adjustment (How high/far you fly)
          let speedMultiplier = 4.2; 
          this.rig.object3D.position.addScaledVector(deltaMovement, speedMultiplier);
          
          // Custom anti-float falling gravity baseline
          if (this.rig.object3D.position.y > 0) {
            this.rig.object3D.position.y -= 0.08; 
          } else {
            this.rig.object3D.position.y = 0; 
          }
          
          this.lastHandPos.copy(currentHandPos);
        }
      });
    </script>
  </head>
  <body>
    <a-scene background="color: #0d061f" embedded style="height: 100%; width: 100%;">
      
      <!-- A rotating center core target point -->
      <a-box position="0 1.5 -3" color="#ff0055" animation="property: rotation; to: 0 360 0; loop: true; dur: 5000"></a-box>
      
      <!-- Lord Doomsday (Doctor Doom Variant) -->
      
        <a-cone color="#1b4d22" radius-bottom="0.8" height="2" position="0 1 0"></a-cone> 
        <a-sphere color="#8c939d" radius="0.4" position="0 2.1 0"></a-sphere> 
      

      <!-- Shadow Monarch (Sung Jinwoo Variant) -->
      
        <a-cylinder color="#0d021f" radius="0.4" height="2.2" position="0 1.1 0"></a-cylinder> 
        <a-sphere color="#ffffff" radius="0.35" position="0 2.3 0"></a-sphere> 
      

      <!-- Neon Skyscrapers to test your hand swing jumps -->
      <a-box position="-6 3 -12" width="4" height="6" depth="4" color="#00ffcc"></a-box>
      <a-box position="6 5 -15" width="5" height="10" depth="5" color="#ff0055"></a-box>
      <a-plane position="0 0 0" rotation="-90 0 0" width="100" height="100" color="#1a1230"></a-plane>

      <!-- Fully functional Hand Tracking VR Rig -->
      
        <a-camera position="0 1.6 0"></a-camera>
        
        
      

    </a-scene>
  </body>
</html>
