<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Super Overlord VR Arena</title>
    <!-- Super fast VR engine link -->
    <script src="https://cloudflare.com"></script>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    </style>
  </head>
  <body>
    <!-- Our main dark neon superhero arena -->
    <a-scene background="color: #0d061f">
      
      <!-- A spinning pink target box to prove the game loaded -->
      <a-box position="0 1.5 -3" color="#ff0055" animation="property: rotation; to: 0 360 0; loop: true; dur: 5000"></a-box>
      
      <!-- Safe Parody Boss 1: "Lord Doomsday" (Doctor Doom style) -->
      <a-cone id="boss-doomsday" color="#1b4d22" radius-bottom="0.8" height="2" position="-3 1 -6"></a-cone>
      <a-sphere color="#8c939d" radius="0.4" position="-3 2.1 -6"></a-sphere>

      <!-- Safe Parody Boss 2: "Shadow Monarch" (Sung Jinwoo style) -->
      <a-cylinder id="boss-monarch" color="#0d021f" radius="0.4" height="2.2" position="3 1.1 -6"></a-cylinder>
      <a-sphere color="#ffffff" radius="0.35" position="3 2.3 -6"></a-sphere>

      <!-- The ground floor -->
      <a-plane position="0 0 0" rotation="-90 0 0" width="50" height="50" color="#1a1230"></a-plane>

      <!-- Player eyes setup -->
      
        <a-camera position="0 1.6 0"></a-camera>
      

    </a-scene>
  </body>
</html>
