<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Super Overlord VR Arena</title>
    <style>
      body { margin: 0; background-color: #0d061f; overflow: hidden; }
      canvas { width: 100vw; height: 100vh; display: block; }
    </style>
  </head>
  <body>
    <!-- The HTML5 canvas that forces the headset to render pure 3D -->
    <canvas id="vrCanvas"></canvas>

    <script>
      // Pure JavaScript 3D Engine Setup (Zero downloads, zero white screens)
      const canvas = document.getElementById('vrCanvas');
      const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
      
      if (!gl) {
        document.body.innerHTML = "<h1 style='color:white; text-align:center;'>WebGL Not Supported</h1>";
      }

      // Automatically set the 3D space size to match the VR viewport
      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        gl.viewport(0, 0, canvas.width, canvas.height);
      }
      window.addEventListener('resize', resize);
      resize();

      // Clear the screen to our dark purple arena background color
      function draw() {
        gl.clearColor(0.05, 0.02, 0.12, 1.0); // Purple color values
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
        requestAnimationFrame(draw);
      }
      draw();
    </script>
  </body>
</html>
